<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>หอไตร ค้นพระไตรปิฎก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Srisakdi:wght@700&family=Taviraj:wght@400;600&display=swap">
<style>
/* Layout: one column (search, then results); the reader is a full-screen sheet on phones and a docked right pane from 1000px.
   Palette: saffron robe on indigo ink; three pitaka colours mark every volume reference. */
:root{
  --bg:#F3F1EB; --surface:#FFFFFF; --sunk:#E6E2D8; --hover:#EFE7D9;
  --ink:#1B2030; --muted:#5B5F6E; --line:#D8D3C6;
  --accent:#A65B08; --accent-strong:#8A4A05; --accent-ink:#FFFFFF; --accent-soft:#F5E3C6;
  --hit:#F9D57F; --hit-ink:#1B2030;
  --vin:#B04A31; --sut:#B7700E; --abh:#3D5A8E;
  --scrim:rgb(12 14 20 / .45);
  --font-ui:"Anuphan","Noto Sans Thai","Leelawadee UI","Thonburi",system-ui,sans-serif;
  --font-text:"Taviraj","Noto Serif Thai","Thonburi","Tahoma",serif;
  --font-mark:"Srisakdi","Taviraj",serif;
  --read-size:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10131A; --surface:#181C26; --sunk:#0B0D12; --hover:#231E16;
  --ink:#ECE8DE; --muted:#A4A4A8; --line:#2B303D;
  --accent:#E9A24A; --accent-strong:#F2B868; --accent-ink:#1A1206; --accent-soft:#3A2911;
  --hit:#7C5612; --hit-ink:#FFF3D6;
  --vin:#E0806A; --sut:#E9A24A; --abh:#8FA7DC; --scrim:rgb(0 0 0 / .6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131A; --surface:#181C26; --sunk:#0B0D12; --hover:#231E16;
  --ink:#ECE8DE; --muted:#A4A4A8; --line:#2B303D;
  --accent:#E9A24A; --accent-strong:#F2B868; --accent-ink:#1A1206; --accent-soft:#3A2911;
  --hit:#7C5612; --hit-ink:#FFF3D6;
  --vin:#E0806A; --sut:#E9A24A; --abh:#8FA7DC; --scrim:rgb(0 0 0 / .6); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- header + search ---------- */
.brand{display:flex;align-items:center;gap:12px;padding-block:14px 6px}
.mark{font-family:var(--font-mark);font-weight:700;font-size:30px;line-height:1;color:var(--accent);margin:0}
.brand-sub{font-size:12.5px;color:var(--muted);line-height:1.35}
.grow{flex:1}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--ink)}
.iconbtn:hover{background:var(--hover)}
.iconbtn svg{width:22px;height:22px}
.sbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:8px}
.sbox{display:flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px 5px 4px 12px}
.sbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sbox svg{width:20px;height:20px;color:var(--muted);flex:none}
.sbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:500 18px/1.4 var(--font-ui);color:var(--ink);padding:10px 2px}
.sbox input::-webkit-search-cancel-button,.sbox input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.sbox input::placeholder{color:var(--muted);font-weight:400;opacity:.85}
.go{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:10px;padding:9px 16px;white-space:nowrap}
.go:hover{background:var(--accent-strong)}
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding-block:10px 2px}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:999px;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgb(0 0 0 / .14)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;line-height:1.3;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);border:0;background:none;padding:4px 2px}
.toggle i{width:34px;height:20px;border-radius:999px;background:var(--sunk);position:relative;flex:none;transition:background .15s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0 / .25);transition:transform .15s}
.toggle[aria-pressed="true"]{color:var(--ink)}
.toggle[aria-pressed="true"] i{background:var(--accent)}
.toggle[aria-pressed="true"] i::after{transform:translateX(14px)}

/* ---------- sections and rows ---------- */
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:0 0 8px;font-size:12.5px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.sec-h .grow{flex:1}
.sec-h button{border:0;background:none;color:var(--accent-strong);font-size:13px;font-weight:600;letter-spacing:0;padding:0}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 4px;color:var(--ink)}
.row:hover{background:var(--hover)}
.t1{font-family:var(--font-text);font-weight:600;font-size:18px;line-height:1.35}
.no{color:var(--muted);font-weight:400;margin-right:5px}
.tag{display:inline-block;font:500 11.5px/1 var(--font-ui);padding:4px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);vertical-align:3px;margin-left:6px;white-space:nowrap}
.tag.code{border-color:transparent;background:var(--accent-soft);color:var(--accent-strong)}
.tag.ph{border-color:transparent;background:var(--hit);color:var(--hit-ink)}
.sub{font-family:var(--font-text);color:var(--muted);font-size:15px;line-height:1.5}
.aka{font-size:13px;color:var(--muted)}
.loc{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
.vtag{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--ink)}
.vtag::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--pk,var(--muted))}
.pk-vin{--pk:var(--vin)} .pk-sut{--pk:var(--sut)} .pk-abh{--pk:var(--abh)}
.snip{font-family:var(--font-text);font-size:16.5px;line-height:1.8;margin:5px 0 0;overflow-wrap:anywhere}
mark{background:var(--hit);color:var(--hit-ink);border-radius:3px;padding:0 1px}
.ctx{font-weight:600;color:var(--ink)}
.more{display:block;margin:12px auto 0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 18px;font-size:14px}
.note{font-size:13.5px;color:var(--muted);margin:8px 0}
.alert{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px;margin:10px 0}

.jump{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--ink);color:var(--bg);border:0;border-radius:14px;padding:14px 16px;margin-top:16px}
.jump b{font-family:var(--font-text);font-size:18px}
.jump .grow{display:flex;flex-direction:column;gap:2px}
.jump small{opacity:.75;font-size:13px}
.jump svg{width:22px;height:22px;flex:none}

.runbox{border:1px dashed var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.runbox .go{padding:10px 18px}
.prog{height:4px;background:var(--sunk);border-radius:99px;overflow:hidden;width:100%}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.status{font-size:13.5px;color:var(--muted)}

/* shelf: 45 volumes as books on a shelf */
.shelf{display:grid;grid-template-columns:repeat(45,minmax(0,1fr));gap:2px;align-items:end;height:68px;margin-top:6px}
.shelf button{height:100%;border:0;padding:0;background:none;display:flex;align-items:flex-end;min-width:0}
.shelf button span{display:block;width:100%;height:var(--h);min-height:3px;background:var(--pk);border-radius:2px 2px 0 0;opacity:.88}
.shelf button.z span{opacity:.2}
.shelf button[aria-pressed="true"] span{opacity:1;box-shadow:0 0 0 2px var(--ink)}
.shelf-leg{display:grid;grid-template-columns:8fr 25fr 12fr;gap:2px;margin-top:4px;font-size:11.5px;color:var(--muted)}
.shelf-leg span{border-top:3px solid var(--pk);padding-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.vols{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 18px}
details.pit{border-top:1px solid var(--line)}
details.pit summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 2px;font-weight:600}
details.pit summary::-webkit-details-marker{display:none}
details.pit summary::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--pk)}
details.pit summary .n{color:var(--muted);font-weight:400;font-size:13px}
.vrow{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 2px}
.vrow:hover{background:var(--hover)}
.vrow .vn{font-variant-numeric:tabular-nums;font-weight:600;min-width:2.2em;color:var(--pk)}
.vrow .vt{flex:1;min-width:0}

.foot{margin:34px 0 calc(28px + env(safe-area-inset-bottom,0px));font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.foot button{border:0;background:none;color:var(--accent-strong);padding:0;font-size:12.5px}

/* ---------- reader ---------- */
.reader{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.rd-top{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 6px) max(10px,env(safe-area-inset-right,0px)) 6px max(6px,env(safe-area-inset-left,0px))}
.rd-title{flex:1;min-width:0;line-height:1.3}
.rd-title b{display:block;font-family:var(--font-text);font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-title span{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-body{flex:1;width:100%;max-width:720px;margin:0 auto;padding:4px max(18px,env(safe-area-inset-right,0px)) 40px max(18px,env(safe-area-inset-left,0px));
  font-family:var(--font-text);font-size:var(--read-size);line-height:1.9;overflow-wrap:anywhere}
.pgno{display:flex;align-items:center;gap:10px;color:var(--muted);font:500 12px/1 var(--font-ui);margin:22px 0 10px;font-variant-numeric:tabular-nums}
.pgno::before,.pgno::after{content:"";flex:1;height:1px;background:var(--line)}
.pa{margin:0 0 .5em;text-indent:1.6em}
.pa.nc{text-indent:0}
.hd{text-align:center;margin:1.3em 0 .25em;line-height:1.45;scroll-margin-top:80px;text-wrap:balance}
.hd.lv1{font-size:1.2em;font-weight:600;color:var(--accent-strong)}
.hd.lv2{font-size:.98em;font-weight:600;color:var(--muted);letter-spacing:.02em}
.hd.lv3{font-size:1.16em;font-weight:600}
.hd.tgt{background:var(--accent-soft);border-radius:8px}
.hs{text-align:center;color:var(--muted);margin:0 0 .9em;font-size:.9em;line-height:1.5}
.vs{margin:.35em 0 .75em;padding-left:1.1em;border-left:2px solid var(--line)}
.vl{display:block}
.fn{font-size:.8em;color:var(--muted);margin:.2em 0;line-height:1.6}
.it{display:inline-block;font:600 .68em/1 var(--font-ui);color:var(--accent-strong);background:var(--accent-soft);border-radius:6px;padding:.3em .45em;margin-right:.4em;vertical-align:.18em;text-indent:0;scroll-margin-top:84px;font-variant-numeric:tabular-nums}
.it.tgt{background:var(--accent);color:var(--accent-ink)}
.ol{white-space:pre-wrap;line-height:1.75}
.ol.i1{padding-left:1.2em} .ol.i2{padding-left:2.6em}
.prevp{display:block;margin:14px auto 0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font:500 13.5px var(--font-ui)}
.rd-end{height:1px}
.rd-load{padding:40px 0;text-align:center;font-family:var(--font-ui);color:var(--muted)}
.rd-bar{position:sticky;bottom:0;z-index:3;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:center;gap:2px;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.rd-bar button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;border-radius:10px;padding:6px 4px;font-size:12px;color:var(--ink)}
.rd-bar button:hover{background:var(--hover)}
.rd-bar svg{width:21px;height:21px}
@media (min-width:1000px){
  .reader{left:auto;width:min(780px,58vw);border-left:1px solid var(--line);box-shadow:-14px 0 40px rgb(0 0 0 / .08)}
  body.reading .wrap{margin-left:max(0px,calc((100vw - min(780px,58vw) - 860px)/2));margin-right:0;max-width:min(860px,calc(100vw - min(780px,58vw) - 40px))}
}

/* ---------- sheet, toast ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:var(--scrim)}
.sheet-panel{position:relative;width:100%;max-width:640px;max-height:86vh;display:flex;flex-direction:column;background:var(--surface);border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.sheet{align-items:center}.sheet-panel{border-radius:18px;max-height:80vh}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 18px;border-bottom:1px solid var(--line)}
.sheet-head b{flex:1;font-family:var(--font-text);font-size:17px;line-height:1.35}
.sheet-body{overflow-y:auto;padding:6px 18px 18px;overscroll-behavior:contain}
.toc{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 2px;color:var(--ink)}
.toc:hover{background:var(--hover)}
.toc .tt{font-family:var(--font-text);font-size:16px}
.toc .ti{float:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:8px}
.toc.lv1{font-weight:600;padding-top:14px}
.toc.lv1 .tt{color:var(--accent-strong)}
.toc.lv2 .tt{font-weight:600;color:var(--muted);font-size:15px}
.toc.lv3{padding-left:14px}
.toc.cur{background:var(--accent-soft)}
.toc small{display:block;color:var(--muted);font-size:13px;font-family:var(--font-text)}
.field{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;font-size:16px;margin:8px 0 6px;color:var(--ink)}
.field:focus{outline:0;border-color:var(--accent)}
.menu a,.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 2px;color:var(--ink);text-decoration:none;font-size:15px}
.menu a:hover,.menu button:hover{background:var(--hover)}
.menu small{display:block;color:var(--muted);font-size:12.5px}
.menu svg{width:20px;height:20px;flex:none;color:var(--muted)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin:6px 0 12px}
.vgrid button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 4px;font-variant-numeric:tabular-nums;border-top:3px solid var(--pk)}
.vgrid button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);border-top-color:var(--pk)}
.lbl{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.05em;margin:14px 0 4px}
.sizes{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(92vw,520px);box-shadow:0 6px 24px rgb(0 0 0 / .2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <h1 class="mark">หอไตร</h1>
    <div class="brand-sub">ค้นพระไตรปิฎก ฉบับหลวง ๔๕ เล่ม<br>พร้อมบาลีสยามรัฐ</div>
    <span class="grow"></span>
    <button class="iconbtn" data-act="settings" aria-label="ตั้งค่าและข้อมูล"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </header>

  <div class="sbar">
    <form class="sbox" id="sform" role="search" autocomplete="off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" enterkeyhint="search" placeholder="ชื่อพระสูตร ข้อความ หรือ เล่ม/ข้อ" aria-label="คำค้น">
      <button class="iconbtn" type="button" data-act="clear" id="clearBtn" aria-label="ล้างคำค้น" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <button class="go" type="submit">ค้น</button>
    </form>
    <div class="opts">
      <div class="seg" role="group" aria-label="ฉบับ">
        <button type="button" data-act="ed" data-ed="th" aria-pressed="true">ฉบับหลวง (ไทย)</button>
        <button type="button" data-act="ed" data-ed="pali" aria-pressed="false">บาลีสยามรัฐ</button>
      </div>
      <button type="button" class="toggle" data-act="loose" aria-pressed="false"><i></i>สะกดใกล้เคียง</button>
    </div>
  </div>

  <div class="chips" id="scope" role="group" aria-label="ขอบเขต" style="padding-top:6px"></div>

  <main id="main"></main>

  <footer class="foot">
    ข้อความพระไตรปิฎกภาษาไทย ฉบับหลวง และบาลีฉบับสยามรัฐ จากฐานข้อมูล D‑Tipitaka (ต้นฉบับ E‑Tipitaka) ·
    เลขข้อตรงกับ 84000.org แต่เลขหน้าอาจต่างกัน · <button data-act="settings">ตั้งค่าและดาวน์โหลดเก็บไว้</button>
  </footer>
</div>

<div class="reader" id="reader" hidden>
  <header class="rd-top">

<script>
/*CORE-START*/
const TD = '๐๑๒๓๔๕๖๗๘๙';
const thd = n => String(n).replace(/[0-9]/g, d => TD[d]);
const ard = s => String(s).replace(/[๐-๙]/g, d => String(TD.indexOf(d)));
const IGNC = '\\s\\-_"\'“”‘’().,?!:;…\\[\\]';
const IGN = '[' + IGNC + ']*';
const IGN_G = new RegExp('[' + IGNC + ']+', 'g');
const RX_ESC = c => c.replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&');

function normQuery(s) {
  return String(s)
    .replace(/ํา/g, 'ำ')
    .replace(/([่-๋])([ัิ-ื็])/g, '$2$1')
    .replace(/[0-9]/g, d => TD[d]);
}
// Split a query into AND-terms; "quoted text" stays one term. Spacing and punctuation never matter inside a term.
function termsOf(q) {
  const out = []; const re = /"([^"]+)"|“([^”]+)”|(\S+)/g; let m;
  while ((m = re.exec(q))) {
    const t = normQuery(m[1] || m[2] || m[3]).replace(IGN_G, '');
    if (t) out.push(t);
  }
  return out;
}
function exactSrc(t) { return [...t].map(RX_ESC).join(IGN); }
const CONF = ['ฏฎ', 'ณน', 'ศษส', 'ฬล', 'ฑท', 'ฆค', 'ภพ', 'ฌช', 'ฐถ'];
const CONF_OF = {}; CONF.forEach(g => [...g].forEach(c => { CONF_OF[c] = '[' + g + ']'; }));
const MK = '[\\u0E47-\\u0E4C\\u0E3A\\u0E4D]*';
// Loose spelling: ignore tone marks, phinthu, doubled consonants, ฏ/ฎ-type look-alikes, ธรรม/ธัมม,
// and Thai-style Pali spelling (สังขารา ↔ สงฺขารา, อนิจจัง ↔ อนิจฺจํ).
function looseSrc(t) {
  t = t.replace(/[็-์]/g, '').replace(/รร/g, '\u0001').replace(/[ฺํ]/g, '')

  const A = '(?:(?:รร|ั)' + MK + ')?';
  const out = [];
  for (const c of t) {
    if (c === '\u0001' || c === 'ั') out.push(A);
    else if (c === '\u0002') out.push('(?:' + A + cons('ง') + '|ํ)');
    else if (c === '\u0003') out.push('(?:' + A + cons('ม') + '|ํ)');
    else if (c === 'ะ') out.push('ะ?');
    else if (c >= 'ก' && c <= 'ฮ') out.push(cons(c));

}
function buildQuery(q, loose) {
  const ts = termsOf(q);
  const terms = ts.map(t => ({ t, len: [...t].length, src: loose ? looseSrc(t) : exactSrc(t) }));
  const phraseSrc = terms.length > 1 ? (loose ? looseSrc(ts.join('')) : exactSrc(ts.join(''))) : null;
  return { q, loose, terms, phraseSrc, srcs: phraseSrc ? [phraseSrc].concat(terms.map(x => x.src)) : terms.map(x => x.src) };
}

// ---- names (sutta titles) ----
const SK_MAP = { 'ฎ': 'ฏ', 'ณ': 'น', 'ศ': 'ส', 'ษ': 'ส', 'ฬ': 'ล', 'ฑ': 'ท', 'ฒ': 'ท', 'ฆ': 'ค', 'ภ': 'พ', 'ฌ': 'ช', 'ฐ': 'ถ', 'ธ': 'ท' };
const SUFFIX = /(สูตร|ชาดก)(ที่[๐-๙]+)?$/;
function nameKey(s) { return normQuery(s).replace(IGN_G, '').replace(/[ๆฯ]/g, ''); }
function skel(s) {
  let k = nameKey(s).replace(/ที่[๐-๙]+$/, '').replace(/[๐-๙]/g, '');
  k = k.replace(/(สูตร|ชาดก|วรรค|สังยุตต์|นิบาต|กถา|คาถา|นิทเทส|อปทาน|ปทาน|วิมาน|เปตวัตถุ|สิกขาบท)$/, '');
  k = k.replace(/รร/g, '').replace(/[ะ-ฺเ-๎ฯ]/g, '');
  return [...k].map(c => SK_MAP[c] || c).join('').replace(/(.)\1+/g, '$1');
}
function bigrams(s) { const a = [...s]; const b = new Set(); if (a.length === 1) b.add(a[0]); for (let i = 0; i + 1 < a.length; i++) b.add(a[i] + a[i + 1]); return b; }

const LVL1 = ['สังยุตต์', 'นิบาต', 'ปัณณาสก์', 'ขันธกะ', 'กัณฑ์'];
function prepIndex(raw) {
  const T = raw.types;
  const E = raw.e.map((r, i) => {
    const [v, p, l, it, pt, tc, title, num, sub, ci, code, aka] = r;
    const t = T[tc];
    const e = { i, v, p, l, it, pt, t, lvl: t === 'วรรค' ? 2 : (LVL1.includes(t) ? 1 : 3), title, num, sub, ctx: raw.ctx[ci] || '', code, aka: aka ? aka.split('|') : [] };
    e.key = nameKey(title); e.key2 = e.key.replace(SUFFIX, '') || e.key;
    e.skel = skel(title); e.bi = bigrams(e.skel);
    e.subKey = sub ? nameKey(sub) : '';
    e.akaKeys = e.aka.map(nameKey); e.akaSk = e.aka.map(skel); e.akaBi = e.akaSk.map(bigrams);
    return e;
  });

  for (const e of E) {
    if (!byVol.has(e.v)) byVol.set(e.v, []);
    byVol.get(e.v).push(e);
    const k = e.v + ':' + e.p; if (!pageHeads.has(k)) pageHeads.set(k, new Map());
    pageHeads.get(k).set(e.l, e);
  }
  for (const arr of byVol.values()) {
    const l3 = arr.filter(e => e.lvl === 3);
    for (let k = 0; k < l3.length; k++) { const e = l3[k], n = l3[k + 1]; e.span = (n && n.pt === e.pt && n.it > e.it) ? Math.min(80, n.it - e.it) : 1; }
  }

}
// Last heading at or before (part, item) in a volume: tells which sutta a passage belongs to.
function entryForItem(IX, v, pt, it) {

  while (lo <= hi) { const mid = (lo + hi) >> 1; const k = arr[mid].pt * 100000 + arr[mid].it; if (k <= key) { ans = mid; lo = mid + 1; } else hi = mid - 1; }

}
function parseRef(q) {
  const s = ard(normQuery(q)).trim().toLowerCase().replace(/\s+/g, ' ');
  let m;

  if ((m = s.match(/^(?:mn|ม\.|มัชฌิม|มัชฌิมนิกาย)\s*\.?\s*(\d{1,3})$/))) return { kind: 'code', code: 'MN ' + (+m[1]) };
  const vol = n => (n >= 1 && n <= 45) ? n : null;
  if ((m = s.match(/^(?:เล่ม(?:ที่)?|ล\.)\s*(\d{1,2})\s*[,/ ]?\s*(?:ข้อ(?:ที่)?|ข\.)\s*(\d{1,5})(?:\s*[-–]\s*\d{1,5})?$/)) && vol(+m[1])) return { kind: 'item', v: +m[1], item: +m[2] };

  if ((m = s.match(/^(?:เล่ม(?:ที่)?|ล\.)\s*(\d{1,2})\s*[,/ ]?\s*(?:หน้า|น\.)\s*(\d{1,4})$/)) && vol(+m[1])) return { kind: 'page', v: +m[1], page: +m[2] };
  if ((m = s.match(/^(?:เล่ม(?:ที่)?|ล\.)\s*(\d{1,2})$/)) && vol(+m[1])) return { kind: 'vol', v: +m[1] };

}
function nameSearch(IX, q, inScope) {
  const ref = parseRef(q);
  if (ref && ref.kind === 'code') return IX.E.filter(e => e.code === ref.code).map(e => ({ e, s: 2000 }));
  const qk = nameKey(q); if ([...qk].length < 2) return [];

  const out = [];
  for (const e of IX.E) {
    if (inScope && !inScope(e.v)) continue;
    let s = 0;
    if (e.key === qk || e.key2 === qk2) s = 1000;
    else if (e.akaKeys.some(a => a === qk || (a.replace(SUFFIX, '') || a) === qk2)) s = 960;
    else if (e.key.startsWith(qk2)) s = 800 - Math.min(150, e.key.length - qk2.length);
    else if (e.key.includes(qk2)) s = 650 - Math.min(150, e.key.length - qk2.length);
    else if (e.akaKeys.some(a => a.includes(qk2))) s = 620;
    else if (qs.length >= 2 && (e.skel.includes(qs) || e.akaSk.some(a => a.includes(qs)))) s = 480 - Math.min(80, Math.abs(e.skel.length - qs.length));

    else if (qs.length >= 3) {
      let d = dice(qb, e.bi); for (const b of e.akaBi) d = Math.max(d, dice(qb, b));
      if (d >= 0.5) s = 150 + Math.round(180 * d);
    }
    if (s) out.push({ e, s: s + (e.lvl === 3 ? 20 : 0) + (e.t === 'สูตร' ? 10 : 0) });
  }
  out.sort((a, b) => b.s - a.s || a.e.i - b.e.i);
  return out;
}

// ---- volume text ----
function parseVol(text, ed, v) {
  const starts = [], bodies = [], pageNo = [], items = [];
  let i = text.indexOf('\f');
  while (i >= 0) {
    let nl = text.indexOf('\n', i); if (nl < 0) nl = text.length;
    const hdr = text.slice(i + 1, nl), tab = hdr.indexOf('\t');
    starts.push(i); bodies.push(Math.min(nl + 1, text.length));
    pageNo.push(parseInt(hdr.slice(0, tab < 0 ? hdr.length : tab), 10)); items.push(tab < 0 ? '' : hdr.slice(tab + 1));
    i = text.indexOf('\f', nl);
  }

  while ((m = re.exec(text))) { const n = parseInt(ard(m[1]), 10); if (n < last - 5) part++; mOff.push(m.index); mN.push(n); mPart.push(part); last = n; }
  return { ed, v, text, n: starts.length, starts: Int32Array.from(starts), bodies: Int32Array.from(bodies), pageNo: Int32Array.from(pageNo), items,
    mOff: Int32Array.from(mOff), mN: Int32Array.from(mN), mPart: Uint8Array.from(mPart), parts: part };
}
function lastLE(arr, x) { let lo = 0, hi = arr.length - 1, ans = -1; while (lo <= hi) { const mid = (lo + hi) >> 1; if (arr[mid] <= x) { ans = mid; lo = mid + 1; } else hi = mid - 1; } return ans; }

function pageEnd(vol, pi) { return pi + 1 < vol.n ? vol.starts[pi + 1] : vol.text.length; }
function pageIndexOf(vol, page) { const k = vol.pageNo.indexOf(page); return k >= 0 ? k : Math.max(0, Math.min(vol.n - 1, page - 1)); }

  for (let k = 0; k < vol.mN.length; k++) if (vol.mN[k] === n && vol.mPart[k] === pt) return k;
  for (let k = 0; k < vol.mN.length; k++) if (vol.mN[k] === n) return k;
  return -1;
}
// Find pages where every term occurs. Terms ignore spacing, line breaks and punctuation.
function searchVol(vol, Q) {

  const anchor = Q.terms.reduce((a, b) => (b.len > a.len ? b : a));
  const re = new RegExp(anchor.src, 'g');
  const res = new Map(); let m;
  while ((m = re.exec(text))) {
    if (!m[0].length) { re.lastIndex++; continue; }
    const pi = pageOf(vol, m.index);
    let r = res.get(pi);
    if (!r) { r = { v: vol.v, pi, page: vol.pageNo[pi], n: 0, off: m.index, len: m[0].length, phrase: false }; res.set(pi, r); }
    r.n++;

  const others = Q.terms.filter(t => t !== anchor).map(t => new RegExp(t.src));
  const ph = Q.phraseSrc ? new RegExp(Q.phraseSrc) : null;

    if (others.length || ph) {
      const a = vol.bodies[r.pi], seg = text.slice(a, pageEnd(vol, r.pi));

}

  }

  for (const r of out) { const L = merged[merged.length - 1]; if (L && r[0] <= L[1]) L[1] = Math.max(L[1], r[1]); else merged.push([r[0], r[1]]); }

// Printed lines break mid-phrase far more often than at a space, so a line break joins without a space

const SP_AFTER = /[.?!ฯ")\]:;,๐-๙0-9…”']/, SP_BEFORE = /[๐-๙0-9("“\['\tฯ]/;

  let k = a; while (k > a0 && !/\s/.test(text[k - 1]) && r.off - k < 110) k--; a = k;

(() => {

// ---------- storage of downloaded volumes (per browser, optional) ----------

    if (C[i].t !== 'verse') continue;
    let j = i + 1; while (j < C.length && C[j].t === 'blank') j++;
    const nx = C[j];
    if ((nx && nx.t === 'cont') || (text[C[i].cs] === '[' && !(nx && nx.t === 'verse'))) C[i].t = 'para';
  }
  C.forEach((c, li) => {
    if (c.t !== 'head' || !c.h.sub) return;
    for (let j = li + 1; j <= li + 3 && j < C.length; j++) {
      const cj = C[j]; if (cj.t === 'blank') continue; if (cj.t === 'head') break;
      if (text.slice(cj.cs, cj.e).replace(/\s+/g, ' ').trim() === c.h.sub) { cj.t = 'sub'; break; }
    }
  });
  let html = `<section class="pg" data-pi="${pi}"><div class="pgno"><span>หน้า ${pg}</span></div>`;

    return html + '</section>';
  }
  let para = null;
  const flush = () => {
    if (!para) return;
    let h = '';
    para.p.forEach((x, k) => {
      let e = x[1], glue = k < para.p.length - 1 ? joinGlue(text[e - 1], text[para.p[k + 1][0]]) : '';
      if (k < para.p.length - 1 && text[e - 1] === '-') { e--; glue = ''; }
      h += seg(text, x[0], e, ranges, vol) + (k < para.p.length - 1 ? glue : '');

    if (c.t === 'head') { flush(); html += `<h3 class="hd lv${c.h.lvl}" id="h-${pg}-${c.li}" data-i="${c.h.i}">${seg(text, c.cs, c.e, ranges, vol)}</h3>`; continue; }
    if (c.t === 'sub') { flush(); html += `<p class="hs">${seg(text, c.cs, c.e, ranges, vol)}</p>`; continue; }
    if (c.t === 'note') { flush(); html += `<p class="fn">${seg(text, c.cs, c.e, ranges, vol)}</p>`; continue; }
    if (c.t === 'verse') {
      flush(); let h = '', j = i;
      while (j < C.length && C[j].t === 'verse') { h += `<span class="vl">${seg(text, C[j].cs, C[j].e, ranges, vol)}</span>`; j++; }
      html += `<div class="vs">${h}</div>`; i = j - 1; continue;
    }
    if (c.t === 'para') { flush(); para = { c: 'pa', p: [[c.cs, c.e]] }; continue; }
    if (!para) para = { c: 'pa nc', p: [] };
    para.p.push([c.cs, c.e]);
  }

}

      if (L === 'part') { openSheet('เปิดใน 84000.org', `<p class="note">ตำแหน่งนี้อยู่ในภาคหลังของเล่ม ${R.v} ซึ่งเลขข้อเริ่มนับใหม่ 84000.org ไม่มีลิงก์ตรงสำหรับส่วนนี้</p>`); break; }
      const a = (href, t, s) => `<a href="${href}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span>${t}<small>${s}</small></span></a>`;
      openSheet(`เปิดเล่ม ${R.v} ข้อ ${R.item} ใน 84000.org`, `<div class="menu">${a(L.th, 'ฉบับหลวง', 'ภาษาไทย ตามเลขข้อ')}${a(L.pali, 'บาลีอักษรไทย', 'ฉบับสยามรัฐ')}${a(L.roman, 'บาลีอักษรโรมัน', 'Pali Roman')}${a(L.attha, 'อรรถกถา', 'คำอธิบายของข้อนี้')}</div><p class="note">ลิงก์ไปยังเว็บไซต์ 84000.org ซึ่งบางช่วงอาจเปิดช้า</p>`);
      break;
    }
    case 'aa': openSettings(); break;
    case 'settings': openSettings(); break;
    case 'size': S.size = +b.dataset.s; LS.set('size', S.size); document.documentElement.style.setProperty('--read-size', S.size + 'px'); $$('[data-act="size"]').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.s === S.size))); break;
    case 'mode': S.mode = b.dataset.m; LS.set('mode', S.mode); $$('[data-act="mode"]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.m === S.mode))); if (R.open) { const it = R.item, pt = R.pt; renderReader(); const el = $(`.it[data-it="${it}"][data-pt="${pt}"]`, rdBody); if (el) scrollToEl(el); } break;
    case 'dl': b.disabled = true; await downloadAll(b.dataset.ed); b.disabled = false; break;
    case 'clearcache': await idbClear(); toast('ล้างข้อมูลที่เก็บไว้แล้ว'); break;
    case 'sheet-close': closeSheet(); break;
  }
});
function saveRecentIfTyped() { const q = S.q.trim(); if (q) saveRecent(q); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#sheet').hidden) closeSheet(); else if (R.open) closeReader(false); }
  if (e.key === '/' && document.activeElement !== qEl && !R.open && $('#sheet').hidden) { e.preventDefault(); qEl.focus(); }
});

// ---------- start ----------
renderEd(); renderScope(); renderHome();
loadIndex().then(() => { if (S.q.trim()) renderResults(); else renderHome(); })
  .catch(err => { $('#main').insertAdjacentHTML('afterbegin', `<div class="alert">โหลดดัชนีพระสูตรไม่สำเร็จ (${H(err.message)}) ลองรีเฟรชหน้า</div>`); });
})();
